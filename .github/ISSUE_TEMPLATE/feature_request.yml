name: 功能建议
description: 提议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 说明使用场景，而不只是方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我理解本项目处于 0.x 阶段，该功能可能改变公共接口
          required: false
